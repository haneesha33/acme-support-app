name: AuditLens
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  auditlens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: haneesha33/auditlens@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fail-on: critical
